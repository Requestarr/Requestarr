name: Code scan

# GitHub's code scan (CodeQL): on a promotion (build.yml calls it, so a finding fails its build check), once a week on
# dev, the default branch, and by hand. Never on a pull request into dev (docs/development.md#code-scan).
on:
  workflow_call:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      # On a promotion too: every line, not only those the pull request changes.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"
    strategy:
      fail-fast: false
      matrix:
        language: [actions, csharp, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  findings:
    name: Findings
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: A finding on dev becomes an issue; anywhere else it fails the check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: python3 .github/code_scan.py
