name: Build

# What runs when (docs/development.md#continuous-integration):
#   a pull request into dev: the build, the code checks and Requestarr's own tests
#   a pull request or push into qa, staging or main, a Dependabot pull request, a run by hand: the same with every test
#   a push to dev: everything but the tests, which ran on the pull request
# Linux only: the image that ships is. A push to any other branch runs nothing; its pull request does.
on:
  push:
    branches: [dev, qa, staging, main]
  # edited: a "No changelog:" line added to the description later is read again (docs/development.md#changelog).
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# A new push cancels the build it replaces; an edited description waits instead, so it never turns a build that was
# going to pass into a cancelled one. Nothing cancels a run by hand: a promotion may be waiting for it.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.event.action != 'edited' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build, with the analyzers
        run: dotnet build src/Requestarr.sln -c Debug -p:Platform=Posix

  unused:
    name: Unused C# code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: No unused public or internal members in Requestarr's code (Roslynator)
        run: |
          dotnet restore src/Requestarr.sln -p:Platform=Posix
          dotnet tool restore
          python3 .github/unused_check.py

  tests:
    name: Tests
    if: github.event_name != 'push' || github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # own: Requestarr's own tests. Anything not plainly a pull request into dev (or a task's branch) is the full suite.
      SUITE: ${{ github.event_name == 'pull_request' && !contains(fromJSON('["qa", "staging", "main"]'), github.base_ref) && github.event.pull_request.user.login != 'dependabot[bot]' && 'own' || 'full' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build the tests (the backend build has the analyzers)
        run: |
          projects="src/Requestarr.Core.Test src/Requestarr.Api.V1.Test"
          if [ "$SUITE" = full ]; then projects=src/Requestarr.sln; fi
          for project in $projects; do
            dotnet build "$project" -c Debug -p:Platform=Posix -p:RunAnalyzers=false
          done
      - name: Test
        run: python3 .github/run_tests.py "$SUITE"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile --network-timeout 120000
      - name: Type check
        run: yarn tsc --noEmit
      - name: Lint
        run: yarn lint
      # Unused files, exports and packages in the web app, against the baseline (docs/development.md#clean-code).
      - name: Unused code
        run: python3 .github/knip_check.py
      - name: Style lint
        run: yarn stylelint-linux
      - name: Production build
        run: yarn build --env production

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: requestarr:ci
          cache-from: type=gha
          # Saving the layers takes minutes and most of the cache's space, so only dev's, which every pull request reads.
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'type=gha,mode=max' || '' }}

  # Fails a change that adds a credential. The full history was scanned when this was added.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.21.2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scanner self-test (a fake token generated here must be caught)
        run: |
          mkdir -p /tmp/selftest
          echo "token = ghp_$(head -c 300 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)" > /tmp/selftest/fake.txt
          if docker run --rm -v /tmp/selftest:/scan "$GITLEAKS" dir /scan --no-banner --redact; then
            echo "::error::The secret scanner missed a generated fake token"
            exit 1
          fi
          echo "Self-test passed: the scanner caught the generated fake token."
      - name: Scan the commits in this change
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && ! echo "${{ github.event.before }}" | grep -qE '^0+$'; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}~1..${{ github.sha }}"
          fi
          echo "Scanning commits $range"
          docker run --rm -v "$PWD:/repo" --entrypoint sh "$GITLEAKS" -c             "git config --global --add safe.directory /repo && gitleaks git /repo --log-opts='$range' --config /repo/.github/gitleaks.toml --gitleaks-ignore-path /repo/.github/gitleaksignore --no-banner --redact --verbose"

  # Every pull request records its changes in CHANGELOG.md under Unreleased (or says it has none), written to the
  # changelog rule (docs/development.md#changelog; .github/changelog_check.py says what it checks). Numbered versions
  # never change; a release commit carries its goal's build number (docs/development.md#versions,
  # .github/build_numbers.py; release.sh check-changelog).
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Checker self-tests (every rule must catch its sample)
        run: |
          python3 .github/changelog_check.py --self-test
          python3 .github/checklist_check.py --self-test
          python3 .github/build_numbers.py --self-test
          python3 .github/knip_check.py --self-test
          python3 .github/suppression_check.py --self-test
          python3 docker/qa-gate.py --self-test
          python3 docker/qa_checks.py --self-test
          python3 .github/unused_check.py --self-test
          python3 .github/tool_names_check.py --self-test
          python3 .github/app_names_check.py --self-test
          python3 .github/run_tests.py --self-test
      - name: No AI tool named in the code, docs, scripts or image metadata
        run: python3 .github/tool_names_check.py
      - name: No fixed list of app names in what users and admins read
        run: python3 .github/app_names_check.py
      - name: CHANGELOG.md says what this change does under Unreleased, written to the rule
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            python3 .github/changelog_check.py CHANGELOG.md
            python3 .github/checklist_check.py QA-CHECKLIST.md CHANGELOG.md
            exit 0
          fi
          ./release.sh check-changelog "$BASE_SHA" HEAD "$BASE_REF" "$HEAD_SHA" "$HEAD_REF"
      - name: No check quietly switched off (unexplained suppressions, baselines that grow, rules turned down)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/suppression_check.py "$BASE_SHA" HEAD

  # qa, staging and main move only by a promotion (dev's commits, qa's build, staging's build), on the owner's word: any
  # other pull request into them is refused, and a promotion's records who asked (docs/development.md#release-flow). Under
  # its own name only there, so a commit has a passed "Promotion record" only from a promotion.
  promotion:
    name: ${{ contains(fromJSON('["qa", "staging", "main"]'), github.base_ref) && 'Promotion record' || 'Not a promotion' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Only a promotion goes into qa, staging or main, and it names who asked for it
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./release.sh check-promotion "$BASE_REF" "$HEAD_SHA" "$HEAD_REF"

  # Single status for the dev, qa, staging and main branch rules to require. A push to dev reports under another name: it
  # runs no tests, so it must never stand in for the full suite when the same commit is promoted.
  build:
    name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'dev checks' || 'build' }}
    if: always()
    needs: [backend, unused, tests, frontend, docker, secrets, changelog, promotion]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          TESTS_EXPECTED: ${{ github.event_name != 'push' || github.ref != 'refs/heads/dev' }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e --argjson tests "$TESTS_EXPECTED" \
            'to_entries | all(.value.result == "success" or (.key == "tests" and ($tests | not) and .value.result == "skipped"))'
