# Requestarr's beta as a compose file, for anyone who prefers one to Container Manager's Run screens. It runs the same
# container the setup guide's "Running the beta" sets up: the image, a name, a port, a folder, the time zone and the
# GitHub key for bug reports. Paste
# all of it into Synology Container Manager (Project, then Create, then "Create docker-compose.yml"), or save it as
# compose.yaml anywhere Docker Compose runs. Nothing else is needed: no other files, no shell.
#
# Fill in the values block just below, then Next and Done. Requestarr's own settings (your sign-in, which server this
# is, the Discord bot, and the address and key of each Sonarr and Radarr) are made in its web app's first-run setup.
#
#   Newest beta build:  the project's Action, then Build (pull_policy below fetches the newest image first).
#   A specific build:   change ":beta" on the image line to the build number, for example ":0.7.0004", then Build.
#   Going back:         set the older build number, Build, then restore the backup Requestarr took before the update
#                       (System, then Backup, in its web app).
# Every step, screen by screen: the setup guide, "Running the beta" (docs/setup-guide.md).

# ---- Values: fill these in before Next ---------------------------------------------------------------------------------
x-values:
  # The port you open Requestarr on, as http://<your server's address>:19797
  port: &port 19797
  # Your time zone, from https://en.wikipedia.org/wiki/List_of_tz_database_time_zones (for example Europe/London)
  timezone: &timezone Etc/UTC
  # The folder on the server for Requestarr's settings, database and backups. Make it first in File Station and let
  # Everyone read and write it: Requestarr runs as its own user (the setup guide, Running the beta, What you need).
  folder: &folder /volume1/docker/requestarr-beta
  # The GitHub key beta files its bug reports with: a fine-grained token with only Issues: read and write on
  # Requestarr/Requestarr. It's set here, never in the web app.
  github_key: &github_key paste-the-github-key-here
# -------------------------------------------------------------------------------------------------------------------------

name: requestarr-beta

services:
  requestarr:
    image: ghcr.io/requestarr/requestarr:beta
    container_name: requestarr-beta
    # Build always checks for a newer image under the tag above, so updating is one action.
    pull_policy: always
    environment:
      TZ: *timezone
      REQUESTARR_GITHUB_ISSUES_TOKEN: *github_key
      # Optional: your own The Movie Database key, in place of the one built into the image (the setup guide, 4.6).
      # REQUESTARR_TMDB_API_KEY: your-tmdb-key
    volumes:
      - type: bind
        source: *folder
        target: /config
    ports:
      - target: 9797
        published: *port
    restart: unless-stopped
