# Requestarr's beta, in one file. Paste all of it into Synology Container Manager (Project, then Create, then "Create
# docker-compose.yml"), or save it as compose.yaml anywhere Docker Compose runs. Nothing else is needed: no other files,
# no shell.
#
# Fill in the values block just below, then Next and Done. Requestarr's own settings (your sign-in, the Discord bot, and
# the address and key of each Sonarr and Radarr) are made in its web app's first-run setup, not here.
#
#   Newest beta build:  the project's Action, then Build (pull_policy below fetches the newest image first).
#   A specific build:   change ":beta" on the image line to the build number, for example ":0.7.0004", then Build.
#   Going back:         set the older build number, Build, then restore the backup Requestarr took before the update
#                       (System, then Backup, in its web app).
# Every step, screen by screen: the setup guide, "Running the beta" (docs/setup-guide.md).

# ---- Values: fill these in before Next ---------------------------------------------------------------------------------
x-values:
  # The port you open Requestarr on, as http://<your server's address>:19797
  port: &port 19797
  # Your time zone, from https://en.wikipedia.org/wiki/List_of_tz_database_time_zones (for example Europe/London)
  timezone: &timezone Etc/UTC
# -------------------------------------------------------------------------------------------------------------------------

name: requestarr-beta

services:
  requestarr:
    image: ghcr.io/requestarr/requestarr:beta
    # Build always checks for a newer image under the tag above, so updating is one action.
    pull_policy: always
    environment:
      # Beta's icons and BETA strip, and every "what's new" post kept for good, like production.
      REQUESTARR_ENVIRONMENT: staging
      TZ: *timezone
    volumes:
      # Settings, the database and its backups. A named volume needs no folder made first.
      - config:/config
    ports:
      - target: 9797
        published: *port
    restart: unless-stopped

volumes:
  config:
    name: requestarr-beta-config
